<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tutor-arch-title tutor-arch-desc">
      <title id="tutor-arch-title">Arquitetura do FluentDev-BR</title>
      <desc id="tutor-arch-desc">O agente de código aplica o protocolo de correção; hooks e o servidor MCP gravam cada erro em corrections.jsonl na pasta por usuário do sistema, de onde stats.json e o relatório em Markdown são derivados e a orientação da sessão retorna ao agente.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- STORE zone (drawn before arrows and nodes) -->
      <rect x="144" y="452" width="724" height="312" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8" stroke-dasharray="5,4"/>
      <rect x="300" y="456" width="412" height="14" rx="2" fill="#f5f5f5"/>
      <text x="506" y="466" fill="#2d3142" fill-opacity="0.55" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">STORE · ~/.fluentdev-br · UM POR USUÁRIO DO SO</text>

      <!-- ============ ARROWS (before nodes) ============ -->

      <!-- A1 Skill -> Agent : protocol -->
      <line x1="500" y1="136" x2="500" y2="190" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="508" y="155" width="70" height="13" rx="2" fill="#f5f5f5"/>
      <text x="512" y="165" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROTOCOLO</text>

      <!-- A2 Agent -> Hooks : correction lines captured by stop -->
      <path d="M372,214 H216 Q208,214 208,222 V332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="256" y="194" width="66" height="13" rx="2" fill="#f5f5f5"/>
      <text x="289" y="204" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">✏️ LINHAS</text>

      <!-- A3 Hooks -> Agent : briefing / focus (dashed return) -->
      <path d="M234,332 V246 Q234,238 242,238 H372" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="270" y="218" width="70" height="13" rx="2" fill="#f5f5f5"/>
      <text x="305" y="228" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BRIEFING</text>

      <!-- A4 Agent -> MCP : record_corrections -->
      <path d="M628,214 H784 Q792,214 792,222 V332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="678" y="194" width="64" height="13" rx="2" fill="#f5f5f5"/>
      <text x="710" y="204" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORD</text>

      <!-- A5 Hooks -> corrections.jsonl : append -->
      <path d="M208,416 V512 Q208,520 216,520 H372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="258" y="500" width="64" height="13" rx="2" fill="#f5f5f5"/>
      <text x="290" y="510" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPEND</text>

      <!-- A6 MCP -> corrections.jsonl : append -->
      <path d="M792,416 V512 Q792,520 784,520 H628" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="678" y="500" width="64" height="13" rx="2" fill="#f5f5f5"/>
      <text x="710" y="510" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPEND</text>

      <!-- A9 corrections.jsonl -> Hooks : read history for briefing (dashed) -->
      <path d="M372,560 H56 Q48,560 48,552 V382 Q48,374 56,374 H88" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="96" y="540" width="52" height="13" rx="2" fill="#f5f5f5"/>
      <text x="122" y="550" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <!-- A7 corrections.jsonl -> stats.json : derive (dashed) -->
      <path d="M452,600 V624 Q452,632 444,632 H298 Q290,632 290,640 V660" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="341" y="612" width="62" height="13" rx="2" fill="#f5f5f5"/>
      <text x="372" y="622" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DERIVA</text>

      <!-- A8 corrections.jsonl -> log.md : derive (dashed) -->
      <path d="M548,600 V624 Q548,632 556,632 H706 Q714,632 714,640 V660" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="600" y="612" width="62" height="13" rx="2" fill="#f5f5f5"/>
      <text x="631" y="622" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DERIVA</text>

      <!-- ============ NODES ============ -->

      <!-- N3 Skill (correction protocol) -->
      <rect x="372" y="64" width="256" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="372" y="64" width="256" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="384" y="72" width="34" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="401" y="81" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="500" y="102" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Protocolo de correção</text>
      <text x="500" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">perfil pt-BR · 16 categorias</text>

      <!-- N1 Agent -->
      <rect x="372" y="188" width="256" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="372" y="188" width="256" height="76" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="384" y="196" width="46" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="407" y="205" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENTE</text>
      <text x="500" y="228" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agente de código</text>
      <text x="500" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude Code · Codex · Antigravity CLI</text>

      <!-- N2 Hooks -->
      <rect x="88" y="332" width="240" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="332" width="240" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="100" y="340" width="34" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="117" y="349" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
      <text x="208" y="374" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hooks (adaptador)</text>
      <text x="208" y="391" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">session-start · prompt · stop</text>
      <text x="208" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">dist/tutor.mjs hook</text>

      <!-- N4 MCP -->
      <rect x="672" y="332" width="240" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="332" width="240" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="684" y="340" width="30" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="699" y="349" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="792" y="374" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Servidor MCP</text>
      <text x="792" y="391" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">record_corrections</text>
      <text x="792" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">report · briefing · purge</text>

      <!-- N6 corrections.jsonl (FOCAL) -->
      <rect x="372" y="484" width="256" height="116" rx="6" fill="#f5f5f5"/>
      <rect x="372" y="484" width="256" height="116" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="384" y="492" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.6" stroke-width="0.8"/>
      <text x="402" y="501" fill="#c9542a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="500" y="524" fill="#2d3142" font-size="13.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">corrections.jsonl</text>
      <text x="500" y="542" fill="#c9542a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">fonte da verdade · append-only</text>
      <line x1="404" y1="554" x2="596" y2="554" stroke="#eb6c36" stroke-opacity="0.25" stroke-width="0.8"/>
      <text x="500" y="570" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">category · original→correction</text>
      <text x="500" y="583" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mistake_key · occurrence_id</text>
      <text x="500" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ts · client · source</text>

      <!-- N7 stats.json -->
      <rect x="176" y="660" width="228" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="176" y="660" width="228" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="188" y="668" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="214" y="677" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DERIVADO</text>
      <text x="290" y="702" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">stats.json</text>
      <text x="290" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">contagens por categoria</text>

      <!-- N8 english-practice-log.md -->
      <rect x="596" y="660" width="236" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="596" y="660" width="236" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="608" y="668" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="634" y="677" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DERIVADO</text>
      <text x="714" y="702" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">english-practice-log.md</text>
      <text x="714" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">relatório em Markdown</text>

      <!-- ============ LEGEND ============ -->
      <line x1="30" y1="784" x2="970" y2="784" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="30" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>
      <line x1="120" y1="797" x2="150" y2="797" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="158" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">fluxo / gravação</text>
      <line x1="320" y1="797" x2="350" y2="797" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="358" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">leitura / deriva / retorno</text>
      <rect x="560" y="791" width="12" height="12" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="580" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">foco: fonte da verdade</text>
    </svg>
